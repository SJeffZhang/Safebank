name: Component checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen --group poc --python 3.12
      - run: uv run --group poc pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  p1-postgres:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: /tmp/sbg-uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: make setup
      - run: make test-postgres-bootstrap
      - run: make up
      - run: make test-gateway-db
      - run: make test-customer-locks
      - run: make test-wave1-state
      - run: make test-shared-runtime
      - run: make test-w1
      - run: make test-obligations
      - run: make test-w2
      - run: make test-w3a
      - run: make test-p1
      - run: make test-p1-concurrency
      - run: make test-p1-consistency
      - run: make test-integration
      - run: make contracts-check
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
